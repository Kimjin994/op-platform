server:
  port: 8889

spring:
  main:
    allow-circular-references: true
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
    show-sql: false
    generate-ddl: true
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: false
        jdbc:
          batch_size: 1000
        order_inserts: true

op:
  message:
    verifyLength: 6
    validTime: 5
    sendInterval: 1
    sendMaxTimes: 10
    # 登录验证码模板，需事先在 message_template 中配置。本期不真实下发，验证码见 verify_record
    loginTemplateCode: LOGIN_VERIFY
  security:
    urls:
      un-auth-urls:
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
        - /actuator/health

invoice:
  operate:
    drawer: 张三
    reviewer: 李四
    payee: 王五

