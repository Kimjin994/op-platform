# 内存 H2，不连 Nacos。ES 连本机 127.0.0.1:9200（OrbStack 的 es7-local）。
# 没起 ES 时设 ES_ENABLED=false：不建索引、不做健康检查。下单、开票仍会写 ES，那时会失败。
spring:
  datasource:
    url: jdbc:h2:mem:system-center;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: embedded
      data-locations: classpath:db/local-data.sql

management:
  health:
    elasticsearch:
      enabled: ${ES_ENABLED:true}

es:
  enabled: ${ES_ENABLED:true}
  nodes:
    - ${ES_NODE:127.0.0.1:9200}
  username: ${ES_USER:elastic}
  password: ${ES_PASSWORD:elastic}
