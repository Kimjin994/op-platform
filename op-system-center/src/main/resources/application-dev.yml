spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/system-center?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      max-lifetime: 600000
  jpa:
    database-platform: org.hibernate.dialect.MySQL5InnoDBDialect

management:
  health:
    elasticsearch:
      enabled: ${ES_ENABLED:true}

es:
  enabled: ${ES_ENABLED:true}
  nodes:
    - ${ES_NODE:127.0.0.1:9200}
  username: ${ES_USER:elastic}
  password: ${ES_PASSWORD:elastic}
